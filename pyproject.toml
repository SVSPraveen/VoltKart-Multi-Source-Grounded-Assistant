[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voltkart-assistant"
version = "0.1.0"
description = "Multi-Source Grounded Chat Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "duckdb>=1.1.0",
    "sqlglot>=25.0.0",
    "pandas>=2.2.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "fastembed>=0.9.0",
    "python-multipart>=0.0.18",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["backend", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
